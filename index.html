<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Python Practical AI</title>

<script src="https://js.puter.com/v2/"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07080c;
    --panel:#0d1017;
    --panel2:#11151e;
    --border:rgba(255,255,255,.09);
    --text:#f5f7fb;
    --muted:#9299aa;
    --accent:#7c5cff;
    --accent2:#a78bfa;
    --green:#35d39a;
    --danger:#ff5c72;
    --shadow:0 25px 80px rgba(0,0,0,.45);
}

html,body{
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
}

button,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    height:100dvh;
    display:flex;
    background:
        radial-gradient(circle at 20% 0%,rgba(124,92,255,.12),transparent 35%),
        radial-gradient(circle at 90% 100%,rgba(53,211,154,.06),transparent 30%),
        var(--bg);
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:270px;
    height:100%;
    border-right:1px solid var(--border);
    background:rgba(10,12,18,.82);
    backdrop-filter:blur(25px);
    display:flex;
    flex-direction:column;
    padding:18px;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:24px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#7c5cff,#b08cff);
    box-shadow:0 10px 30px rgba(124,92,255,.3);
    font-size:21px;
    font-weight:900;
}

.brand h1{
    font-size:17px;
    line-height:1.1;
}

.brand span{
    color:var(--muted);
    font-size:11px;
}

.new-chat{
    width:100%;
    border:1px solid var(--border);
    background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(124,92,255,.06));
    color:white;
    padding:13px;
    border-radius:13px;
    font-weight:700;
    margin-bottom:20px;
}

.new-chat:hover{
    border-color:rgba(167,139,250,.5);
}

.side-title{
    color:#777f91;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:8px 4px 10px;
}

.quick{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    border:0;
    background:transparent;
    color:#b9bfcc;
    padding:11px 10px;
    border-radius:10px;
    text-align:left;
    margin-bottom:4px;
}

.quick:hover{
    background:rgba(255,255,255,.05);
    color:white;
}

.sidebar-bottom{
    margin-top:auto;
}

.status{
    border:1px solid var(--border);
    border-radius:13px;
    padding:12px;
    display:flex;
    align-items:center;
    gap:9px;
    color:#aeb5c3;
    font-size:12px;
}

.dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px var(--green);
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:68px;
    flex-shrink:0;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    background:rgba(7,8,12,.65);
    backdrop-filter:blur(20px);
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{
    display:none;
    border:0;
    background:transparent;
    color:white;
    font-size:23px;
}

.top-title{
    font-weight:750;
}

.top-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.top-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:38px;
    height:38px;
    border:1px solid var(--border);
    border-radius:11px;
    background:rgba(255,255,255,.035);
    color:#cbd0da;
}

.icon-btn:hover{
    background:rgba(255,255,255,.08);
    color:white;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
}

.chat-inner{
    width:min(920px,100%);
    margin:auto;
    padding:45px 22px 150px;
}

.welcome{
    text-align:center;
    max-width:760px;
    margin:20px auto 38px;
}

.welcome-logo{
    width:68px;
    height:68px;
    margin:0 auto 18px;
    display:grid;
    place-items:center;
    border-radius:22px;
    background:linear-gradient(135deg,#7c5cff,#a78bfa);
    box-shadow:0 18px 55px rgba(124,92,255,.3);
    font-size:31px;
}

.welcome h2{
    font-size:clamp(28px,5vw,46px);
    line-height:1.05;
    margin-bottom:12px;
    letter-spacing:-1.5px;
}

.welcome p{
    color:var(--muted);
    line-height:1.6;
    font-size:14px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:25px;
}

.card{
    text-align:left;
    padding:17px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.025);
    border-radius:16px;
    color:white;
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
    border-color:rgba(124,92,255,.45);
    background:rgba(124,92,255,.07);
}

.card-icon{
    font-size:20px;
    margin-bottom:10px;
}

.card strong{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.card small{
    color:var(--muted);
    font-size:12px;
}

/* ================= MESSAGES ================= */

.message{
    display:flex;
    gap:13px;
    margin:25px 0;
    animation:fade .25s ease;
}

@keyframes fade{
    from{opacity:0;transform:translateY(5px)}
    to{opacity:1;transform:none}
}

.avatar{
    width:34px;
    height:34px;
    min-width:34px;
    border-radius:11px;
    display:grid;
    place-items:center;
    font-size:13px;
    font-weight:800;
}

.user .avatar{
    background:#252a36;
}

.ai .avatar{
    background:linear-gradient(135deg,#7c5cff,#9d7bff);
}

.message-content{
    min-width:0;
    flex:1;
}

.role{
    color:#8f97a8;
    font-size:11px;
    margin-bottom:7px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.bubble{
    line-height:1.7;
    font-size:14px;
    color:#e6e9ef;
    overflow-wrap:anywhere;
}

.bubble h3{
    font-size:16px;
    margin:18px 0 8px;
    color:white;
}

.bubble h4{
    font-size:14px;
    margin:15px 0 7px;
}

.bubble ul,
.bubble ol{
    padding-left:22px;
    margin:8px 0;
}

.bubble li{
    margin:5px 0;
}

.bubble code:not(pre code){
    padding:2px 6px;
    border-radius:6px;
    background:#171b24;
    color:#c4b5fd;
}

.code-box{
    margin:13px 0;
    border:1px solid var(--border);
    border-radius:13px;
    overflow:hidden;
    background:#080a0f;
}

.code-head{
    height:42px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px 0 14px;
    background:#10131b;
    border-bottom:1px solid var(--border);
}

.code-lang{
    color:#9da5b5;
    font-size:11px;
    font-weight:700;
}

.code-buttons{
    display:flex;
    gap:6px;
}

.code-buttons button{
    border:1px solid var(--border);
    background:#171b24;
    color:#c9ced8;
    border-radius:7px;
    padding:6px 9px;
    font-size:10px;
    font-weight:700;
}

.code-buttons button:hover{
    color:white;
    background:#222735;
}

pre{
    padding:15px;
    overflow:auto;
    font-family:"SFMono-Regular",Consolas,monospace;
    font-size:12px;
    line-height:1.65;
    color:#d8dbe3;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    gap:5px;
    align-items:center;
    margin:20px 0 20px 47px;
}

.typing span{
    width:6px;
    height:6px;
    background:#858da0;
    border-radius:50%;
    animation:bounce 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes bounce{
    0%,80%,100%{transform:translateY(0);opacity:.4}
    40%{transform:translateY(-5px);opacity:1}
}

/* ================= COMPOSER ================= */

.composer-wrap{
    position:absolute;
    left:270px;
    right:0;
    bottom:0;
    padding:15px 22px 20px;
    background:linear-gradient(transparent,var(--bg) 35%);
}

.composer{
    width:min(920px,100%);
    margin:auto;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(15,18,26,.94);
    backdrop-filter:blur(25px);
    border-radius:19px;
    box-shadow:var(--shadow);
    padding:10px;
}

textarea{
    width:100%;
    resize:none;
    max-height:150px;
    min-height:48px;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:9px 10px;
    line-height:1.5;
}

textarea::placeholder{
    color:#6e7585;
}

.composer-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 3px 2px 8px;
}

.hint{
    color:#606878;
    font-size:10px;
}

.send{
    width:40px;
    height:40px;
    border:0;
    border-radius:12px;
    color:white;
    background:linear-gradient(135deg,#7c5cff,#9b7bff);
    font-size:17px;
}

.send:disabled{
    opacity:.4;
}

/* ================= OVERLAY ================= */

.overlay{
    display:none;
}

/* ================= MOBILE ================= */

@media(max-width:760px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        transition:.25s;
        box-shadow:30px 0 80px rgba(0,0,0,.5);
    }

    .sidebar.open{
        left:0;
    }

    .overlay{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.55);
        z-index:10;
    }

    .overlay.show{
        display:block;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        height:62px;
        padding:0 13px;
    }

    .top-title{
        font-size:14px;
    }

    .top-sub{
        font-size:9px;
    }

    .chat-inner{
        padding:30px 14px 135px;
    }

    .welcome{
        margin-top:15px;
    }

    .welcome-logo{
        width:58px;
        height:58px;
        font-size:25px;
    }

    .welcome h2{
        font-size:31px;
    }

    .welcome p{
        font-size:13px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .message{
        gap:9px;
        margin:22px 0;
    }

    .avatar{
        width:31px;
        height:31px;
        min-width:31px;
        font-size:11px;
    }

    .bubble{
        font-size:13px;
    }

    .composer-wrap{
        left:0;
        padding:8px 9px 12px;
    }

    .composer{
        border-radius:16px;
        padding:8px;
    }

    .hint{
        display:none;
    }

    pre{
        font-size:11px;
    }
}

@media(max-width:400px){
    .top-actions .icon-btn:nth-child(2){
        display:none;
    }

    .welcome h2{
        font-size:28px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="logo">Py</div>
            <div>
                <h1>Python Practical AI</h1>
                <span>AI Study Assistant</span>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ New Chat
        </button>

        <div class="side-title">Quick Start</div>

        <button class="quick" onclick="quickAsk('Give me a Python practical program for stack using list with AIM, algorithm, code, sample output and viva questions.')">
            🧱 Stack Program
        </button>

        <button class="quick" onclick="quickAsk('Give me a Python practical program for queue with AIM, algorithm, code, sample output and viva questions.')">
            📦 Queue Program
        </button>

        <button class="quick" onclick="quickAsk('Explain Python file handling practical with AIM, algorithm, full program, output and viva questions.')">
            📄 File Handling
        </button>

        <button class="quick" onclick="quickAsk('Give me a Python program for student mark calculation with AIM, algorithm, code, output and viva questions.')">
            🎓 Student Marks
        </button>

        <button class="quick" onclick="quickAsk('Explain Python exception handling with a simple practical program, output and viva questions.')">
            🛡️ Exception Handling
        </button>

        <div class="sidebar-bottom">
            <div class="status">
                <span class="dot"></span>
                AI Ready
            </div>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

        <header class="topbar">

            <div class="top-left">
                <button class="mobile-menu" id="menuBtn">☰</button>

                <div>
                    <div class="top-title">Python Practical AI</div>
                    <div class="top-sub">Your practical exam assistant</div>
                </div>
            </div>

            <div class="top-actions">
                <button class="icon-btn" onclick="downloadChat()" title="Download Chat">
                    ↓
                </button>

                <button class="icon-btn" onclick="clearChat()" title="Clear">
                    ⌫
                </button>
            </div>

        </header>

        <section class="chat" id="chat">
            <div class="chat-inner" id="chatInner">

                <div class="welcome" id="welcome">

                    <div class="welcome-logo">Py</div>

                    <h2>Python Practical AI</h2>

                    <p>
                        Ask any Python practical question.
                        Get AIM, algorithm, complete code,
                        sample output and viva questions.
                    </p>

                    <div class="cards">

                        <button class="card" onclick="quickAsk('Give me a Python stack practical using list with AIM, algorithm, full code, sample output and 10 viva questions.')">
                            <div class="card-icon">🧠</div>
                            <strong>Practical Program</strong>
                            <small>Complete exam-ready Python programs</small>
                        </button>

                        <button class="card" onclick="quickAsk('Teach me Python in simple language for my practical exam.')">
                            <div class="card-icon">⚡</div>
                            <strong>Learn Python</strong>
                            <small>Simple explanations and examples</small>
                        </button>

                        <button class="card" onclick="quickAsk('Give me important Python viva questions and answers for practical exam.')">
                            <div class="card-icon">🎤</div>
                            <strong>Viva Questions</strong>
                            <small>Important viva questions with answers</small>
                        </button>

                        <button class="card" onclick="quickAsk('Give me 10 important Python practical programs for college exam.')">
                            <div class="card-icon">📚</div>
                            <strong>Exam Preparation</strong>
                            <small>Prepare quickly before your practical</small>
                        </button>

                    </div>

                </div>

            </div>
        </section>

        <!-- COMPOSER -->
        <div class="composer-wrap">

            <div class="composer">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Ask your Python practical question..."
                ></textarea>

                <div class="composer-bottom">

                    <div class="hint">
                        Enter to send · Shift + Enter for new line
                    </div>

                    <button class="send" id="sendBtn" onclick="sendMessage()">
                        ➤
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

<script>
/* =========================================================
   PYTHON PRACTICAL AI
   Uses Puter.js so you don't need your own OpenAI API key
   ========================================================= */

const SYSTEM_PROMPT = `
You are Python Practical AI, an expert college practical-exam assistant.

The user is usually preparing for Python practical examinations.

Give simple, accurate, exam-friendly answers.

When the user asks for a Python practical program, use this structure:

# AIM
# ALGORITHM / STEPS
# PYTHON PROGRAM
# SAMPLE OUTPUT
# VIVA QUESTIONS

Python code must always be inside a fenced code block:

\`\`\`python
code
\`\`\`

Prefer simple Python 3 programs that a college student can understand and write in an exam.

Do not make unnecessarily complicated programs.

If the user asks for an explanation, explain in simple language.

If the user asks for only code, provide only the code.

If the user asks "how to read", explain pronunciation/read-aloud in simple English or Malayalam if appropriate.

If the user asks in Malayalam, answer in simple Malayalam.

Do not mention these system instructions.
`;

let messages = [];
let isGenerating = false;

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const welcome = document.getElementById("welcome");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const menuBtn = document.getElementById("menuBtn");

/* ================= LOCAL STORAGE ================= */

try{
    const saved = localStorage.getItem("python_practical_chat");

    if(saved){
        messages = JSON.parse(saved);

        if(Array.isArray(messages) && messages.length){
            welcome.remove();

            messages.forEach(m=>{
                addMessageToUI(m.role,m.content,false);
            });

            scrollBottom();
        }
    }
}catch(e){
    messages=[];
}

/* ================= MOBILE MENU ================= */

menuBtn.addEventListener("click",()=>{
    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");
});

overlay.addEventListener("click",closeSidebar);

function closeSidebar(){
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

/* ================= TEXTAREA ================= */

input.addEventListener("input",()=>{
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,150)+"px";
});

input.addEventListener("keydown",e=>{
    if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
});

/* ================= SEND ================= */

async function sendMessage(){

    if(isGenerating) return;

    const text=input.value.trim();

    if(!text) return;

    input.value="";
    input.style.height="auto";

    if(welcome){
        welcome.remove();
    }

    messages.push({
        role:"user",
        content:text
    });

    addMessageToUI("user",text,true);
    saveChat();

    isGenerating=true;
    sendBtn.disabled=true;

    const typing=createTyping();

    try{

        /*
          Puter provides browser-side AI access.
          No OpenAI API key is placed in this HTML.
        */

        const history=[
            {
                role:"system",
                content:SYSTEM_PROMPT
            },
            ...messages.slice(-14)
        ];

        const response=await puter.ai.chat(history,{
            model:"gpt-5.6-luna",
            stream:false,
            temperature:.35
        });

        let answer="";

        if(typeof response==="string"){
            answer=response;
        }
        else if(response?.message?.content){
            answer=response.message.content;
        }
        else if(response?.text){
            answer=response.text;
        }
        else{
            answer=String(response);
        }

        typing.remove();

        messages.push({
            role:"assistant",
            content:answer
        });

        addMessageToUI("assistant",answer,true);
        saveChat();

    }catch(error){

        typing.remove();

        const errorText=
`### Unable to connect to AI

The AI service could not complete this request.

Please check your internet connection and try again.

**Error:** ${error?.message || error}`;

        messages.push({
            role:"assistant",
            content:errorText
        });

        addMessageToUI("assistant",errorText,true);
        saveChat();

    }finally{

        isGenerating=false;
        sendBtn.disabled=false;
        input.focus();
    }
}

/* ================= QUICK ASK ================= */

function quickAsk(text){
    closeSidebar();

    input.value=text;
    input.style.height="auto";
    input.style.height=Math.min(input.scrollHeight,150)+"px";

    sendMessage();
}

/* ================= MESSAGE UI ================= */

function addMessageToUI(role,text,scroll=true){

    const message=document.createElement("div");

    message.className=
        "message "+(role==="user"?"user":"ai");

    const avatar=document.createElement("div");

    avatar.className="avatar";
    avatar.textContent=role==="user"?"U":"Py";

    const content=document.createElement("div");
    content.className="message-content";

    const roleLabel=document.createElement("div");
    roleLabel.className="role";
    roleLabel.textContent=role==="user"?"You":"Python Practical AI";

    const bubble=document.createElement("div");
    bubble.className="bubble";

    bubble.innerHTML=formatAI(text);

    content.appendChild(roleLabel);
    content.appendChild(bubble);

    message.appendChild(avatar);
    message.appendChild(content);

    chatInner.appendChild(message);

    if(scroll){
        scrollBottom();
    }
}

/* ================= MARKDOWN ================= */

function escapeHTML(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatAI(text){

    const blocks=[];

    let safe=String(text).replace(
        /```(?:python|py)?\s*([\s\S]*?)```/gi,
        function(_,code){

            const id="code_"+Math.random().toString(36).slice(2);

            blocks.push({
                id,
                code:code.trim()
            });

            return `@@CODE_${blocks.length-1}@@`;
        }
    );

    safe=escapeHTML(safe);

    safe=safe.replace(
        /^###\s+(.+)$/gm,
        "<h3>$1</h3>"
    );

    safe=safe.replace(
        /^##\s+(.+)$/gm,
        "<h3>$1</h3>"
    );

    safe=safe.replace(
        /^#\s+(.+)$/gm,
        "<h3>$1</h3>"
    );

    safe=safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
    );

    safe=safe.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
    );

    safe=safe.replace(
        /^\s*[-•]\s+(.+)$/gm,
        "<li>$1</li>"
    );

    safe=safe.replace(
        /(<li>.*<\/li>)/gs,
        "<ul>$1</ul>"
    );

    safe=safe.replace(/\n\n/g,"<br><br>");
    safe=safe.replace(/\n/g,"<br>");

    blocks.forEach((block,index)=>{

        const escaped=escapeHTML(block.code);

        const html=`
        <div class="code-box">
            <div class="code-head">
                <span class="code-lang">PYTHON</span>

                <div class="code-buttons">
                    <button onclick="copyCode(this)">COPY</button>
                    <button onclick="downloadCode(this)">DOWNLOAD .PY</button>
                </div>
            </div>

            <pre>${escaped}</pre>
        </div>
        `;

        safe=safe.replace(
            `@@CODE_${index}@@`,
            html
        );
    });

    return safe;
}

/* ================= COPY CODE ================= */

async function copyCode(button){

    const code=button
        .closest(".code-box")
        .querySelector("pre")
        .innerText;

    try{
        await navigator.clipboard.writeText(code);

        const old=button.textContent;
        button.textContent="COPIED";

        setTimeout(()=>{
            button.textContent=old;
        },1200);

    }catch(e){
        alert("Copy failed");
    }
}

/* ================= DOWNLOAD CODE ================= */

function downloadCode(button){

    const code=button
        .closest(".code-box")
        .querySelector("pre")
        .innerText;

    const blob=new Blob(
        [code],
        {type:"text/x-python"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="python_practical.py";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
}

/* ================= DOWNLOAD CHAT ================= */

function downloadChat(){

        alert("No chat to download.");
        return;
    }

    let text="PYTHON PRACTICAL AI\n";
    text+="====================\n\n";

    messages.forEach(m=>{

        text+=
            (m.role==="user"?"YOU":"PYTHON PRACTICAL AI")
            +"\n\n";

        text+=m.content+"\n\n";
        text+="--------------------\n\n";
    });

    const blob=new Blob(
        [text],
        {type:"text/plain"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="python-practical-answer.txt";

    document.body.appendChild(a);

}

/* ================= CLEAR ================= */

function clearChat(){

    messages=[];

    localStorage.removeItem(
        "python_practical_chat"
    );

    chatInner.innerHTML="";

    location.reload();
