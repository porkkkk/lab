<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Python Practical Lab</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#080a0f;color:#f5f5f5}.top{position:sticky;top:0;z-index:20;height:64px;background:#0d1017;border-bottom:1px solid #252a34;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:10px;background:#7658e8;display:grid;place-items:center;font-weight:bold}.sub{font-size:11px;color:#8992a2;margin-top:3px}.top button,.tool button,.action button{background:#141922;border:1px solid #2b313d;color:#fff;border-radius:8px;padding:10px 12px;font-weight:bold;font-size:11px;cursor:pointer}.top button:hover,.tool button:hover,.action button:hover{border-color:#7658e8}.menu{display:none}.layout{display:flex}.side{width:245px;position:fixed;left:0;top:64px;bottom:0;overflow:auto;background:#0b0e14;border-right:1px solid #252a34;padding:15px}.side h3{font-size:10px;color:#858e9d}.nav button{width:100%;border:0;background:transparent;color:#adb5c3;text-align:left;padding:9px;border-radius:8px;cursor:pointer}.nav button:hover{background:#151a22;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:30px 22px}.wrap{max-width:1000px;margin:auto}.hero h1{font-size:45px;margin:10px 0}.hero h1 span{color:#9b83f4}.hero p{color:#8e97a7;font-size:13px}.badge{font-size:10px;color:#bdb0ff}.tool{display:grid;grid-template-columns:1fr auto auto auto;gap:7px;margin:20px 0}.search{background:#10141b;border:1px solid #2a303a;border-radius:9px;padding:0 12px;display:flex;align-items:center}.search input{width:100%;height:40px;background:none;border:0;outline:0;color:#fff}.card{border:1px solid #252a34;background:#0f131a;border-radius:12px;margin:9px 0;overflow:hidden}.head{display:flex;align-items:center;padding:13px;gap:10px}.num{width:38px;height:38px;border-radius:9px;background:#211b40;color:#c8baff;display:grid;place-items:center;font-weight:bold;font-size:11px}.headmain{flex:1;cursor:pointer}.title{font-size:13px;font-weight:bold}.desc{font-size:10px;color:#7e8797;margin-top:4px}.arrow{background:#171c25;border:0;color:white;width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:18px}.body{display:none;border-top:1px solid #252a34;padding:12px}.card.open .body{display:block}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;background:#141922;border:1px solid #2b313d;color:#9ca5b4;border-radius:7px;padding:8px 10px;font-size:10px;cursor:pointer}.tab.active{background:#211b40;color:#fff;border-color:#7658e8}.pane{display:none}.pane.active{display:block}.label{font-size:10px;font-weight:bold;margin:8px 0}.box{background:#090c11;border:1px solid #252a34;border-radius:8px;padding:12px;font-size:11px;line-height:1.6;color:#bfc6d1}.steps{display:grid;gap:7px}.step{display:flex;gap:8px;font-size:11px;color:#bbc2ce}.sn{width:21px;height:21px;background:#211b40;color:#c8baff;border-radius:5px;display:grid;place-items:center;flex:none;font-size:9px;font-weight:bold}.code{background:#080a0f;border:1px solid #252a34;border-radius:8px;overflow:hidden}.codebar{background:#141922;padding:7px 9px;display:flex;justify-content:space-between;align-items:center}.codebar span{font-size:9px;color:#8992a2}.codebar button{background:#211b40;color:white;border:1px solid #493d7c;border-radius:6px;padding:6px 8px;font-size:9px;cursor:pointer}pre{margin:0;padding:13px;overflow:auto;max-height:450px;color:#dce2eb;font:11px/1.55 Consolas,monospace}.actions{display:flex;gap:6px;margin-top:12px}.actions button{flex:1}.done{background:#7658e8!important;border-color:#7658e8!important}.viva{display:grid;gap:6px}.v{border:1px solid #252a34;border-radius:7px;padding:9px;background:#12161e}.q{font-size:10px;font-weight:bold}.a{font-size:10px;color:#8f98a8;margin-top:3px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#191e27;border:1px solid #333b48;padding:10px 14px;border-radius:8px;display:none;font-size:10px;z-index:50}.progress{margin-top:20px;padding:12px;border:1px solid #252a34;border-radius:9px;font-size:10px;color:#9da6b5}.bar{height:5px;background:#252a34;border-radius:10px;margin-top:7px;overflow:hidden}.fill{height:100%;width:0;background:#7658e8}.overlay{display:none}@media(max-width:760px){.top{height:58px;padding:0 10px}.menu{display:block!important}.top-actions{display:none}.side{top:58px;left:-280px;width:270px;transition:.2s;z-index:30}.side.open{left:0}.overlay.show{display:block;position:fixed;inset:58px 0 0;background:#0008;z-index:25}.main{margin-left:0;width:100%;padding:20px 8px}.hero h1{font-size:31px}.hero p{font-size:11px}.tool{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.tool button{font-size:9px;padding:9px 7px}.head{padding:10px}.title{font-size:11px}.desc{font-size:9px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button:last-child{grid-column:1/-1}.codebar{gap:5px;flex-wrap:wrap}pre{font-size:10px}}</style></head><body>
<header class="top"><div class="brand"><button class="menu" onclick="menu()">☰</button><div class="logo">Py</div><div><b>Python Practical Lab</b><div class="sub">Easy Exam Study</div></div></div><div class="top-actions"><button onclick="allCode()">↓ All Code</button> <button onclick="allSteps()">↓ All Steps</button></div></header>
<div class="overlay" id="overlay" onclick="menu()"></div><aside class="side" id="side"><h3>PROGRAMS</h3><div class="nav" id="nav"></div><div class="progress"><div id="pt">Completed: 0 / 5</div><div class="bar"><div class="fill" id="fill"></div></div></div></aside>
<main class="main"><div class="wrap"><section class="hero"><div class="badge">● PYTHON PRACTICAL EXAM</div><h1>Python <span>Programs</span></h1><p>Simple programs for practical exam study. Read the AIM, steps, code, output and viva questions.</p></section>
<div class="tool"><div class="search">⌕ <input id="search" placeholder="Search program..." oninput="search()"></div><button onclick="expand()">Expand All</button><button onclick="collapse()">Collapse</button><button onclick="allCode()">All Code</button></div>
<div id="list"></div></div></main><div class="toast" id="toast"></div>
<script>const programs=[{"id": 5, "title": "Dictionary Operations", "desc": "Create, update and retrieve student marks.", "aim": "To create a dictionary and store student marks.", "steps": ["Create a dictionary.", "Store student names and marks.", "Display the stored marks.", "Update Pranav’s mark.", "Add a new student.", "Retrieve a student mark.", "Display the updated dictionary."], "code": "# Create a dictionary and store student marks\nstudents = {\n    \"Pranav\": 85,\n    \"Sidharth\": 78,\n    \"Sinan\": 90\n}\n\n# Display the stored marks\nprint(\"Student Marks:\")\nprint(students)\n\n# Update Pranav's mark\nstudents[\"Pranav\"] = 95\n\n# Add a new student\nstudents[\"Akash\"] = 82\n\n# Display the updated dictionary\nprint(\"\\nAfter updating:\")\nprint(students)\n\n# Retrieve Pranav's mark\nprint(\"\\nSinan's mark:\", students[\"Sinan\"])\n\n# Retrieve Akash's mark\nprint(\"Sidhart's mark:\", students[\"Sidharth\"])", "output": "Student Marks:\n{...}\n\nAfter updating:\n{...}\n\nSinan's mark: 90\nSidhart's mark: 78", "viva": [["What is a dictionary?", "A collection of key-value pairs."], ["How do you add a value?", "Use a new key with a value."], ["How do you update a value?", "Assign a new value to an existing key."]]}, {"id": 7, "title": "File Handling with Exception", "desc": "Write and read student details safely.", "aim": "To write and read a file using exception handling.", "steps": ["Open student.txt in write mode.", "Write name and mark.", "Close the file.", "Open the file in read mode.", "Read and display the data.", "Handle file and other errors."], "code": "try:\n    file = open(\"student.txt\", \"w\")\n\n    file.write(\"Name: Pranav\\n\")\n    file.write(\"Mark: 85\\n\")\n\n    file.close()\n\n    file = open(\"student.txt\", \"r\")\n\n    data = file.read()\n\n    print(data)\n\n    file.close()\n\nexcept FileNotFoundError:\n    print(\"File not found\")\n\nexcept Exception as e:\n    print(\"Error:\", e)", "output": "Name: Pranav\nMark: 85", "viva": [["What is exception handling?", "Handling runtime errors without stopping the program unexpectedly."], ["Which block handles an error?", "except block."], ["What does open() do?", "It opens a file."]]}, {"id": 8, "title": "Patient Registration GUI", "desc": "Create a simple patient registration form.", "aim": "To create a patient registration GUI using Tkinter.", "steps": ["Import tkinter.", "Create the main window.", "Create labels and input boxes.", "Get patient details.", "Create a Register button.", "Display the entered details.", "Run the GUI using mainloop()."], "code": "import tkinter as tk\n\ndef register():\n    name = name_entry.get()\n    age = age_entry.get()\n    disease = disease_entry.get()\n\n    result.config(\n        text=\"Name: \" + name +\n        \"\\nAge: \" + age +\n        \"\\nDisease: \" + disease\n    )\n\nwindow = tk.Tk()\nwindow.title(\"Patient Registration\")\nwindow.geometry(\"350x300\")\n\ntk.Label(window, text=\"Patient Registration\").pack()\n\ntk.Label(window, text=\"Name\").pack()\nname_entry = tk.Entry(window)\nname_entry.pack()\n\ntk.Label(window, text=\"Age\").pack()\nage_entry = tk.Entry(window)\nage_entry.pack()\n\ntk.Label(window, text=\"Disease\").pack()\ndisease_entry = tk.Entry(window)\ndisease_entry.pack()\n\ntk.Button(window, text=\"Register\", command=register).pack()\n\nresult = tk.Label(window, text=\"\")\nresult.pack()\n\nwindow.mainloop()", "output": "Patient Registration\nName: Pranav\nAge: 20\nDisease: Fever", "viva": [["What is GUI?", "Graphical User Interface."], ["Which module is used?", "tkinter."], ["What is Entry?", "It accepts user input."], ["What is mainloop()?", "It keeps the GUI running."]]}, {"id": 9, "title": "System Information", "desc": "Display basic computer system information.", "aim": "To display basic system information using Python.", "steps": ["Import platform and socket.", "Display the operating system.", "Display OS version.", "Display machine type.", "Display processor.", "Display hostname.", "Display IP address."], "code": "import platform\nimport socket\n\nprint(\"System Information\")\nprint(\"-------------------\")\n\nprint(\"Operating System:\", platform.system())\nprint(\"OS Version:\", platform.version())\nprint(\"Machine:\", platform.machine())\nprint(\"Processor:\", platform.processor())\n\nprint(\"Hostname:\", socket.gethostname())\nprint(\"IP Address:\", socket.gethostbyname(socket.gethostname()))", "output": "System Information\n-------------------\nOperating System: Windows\nOS Version: ...\nMachine: AMD64\nProcessor: ...\nHostname: DESKTOP-PC\nIP Address: 192.168.1.10", "viva": [["Which module gives OS information?", "platform."], ["Which module gives hostname?", "socket."], ["What does platform.system() return?", "The operating system name."], ["What does socket.gethostname() return?", "The computer hostname."]]}, {"id": 10, "title": "Log File Analysis", "desc": "Find lines containing the word error in a log file.", "aim": "To find error messages in a log file.", "steps": ["Open the log file.", "Read the file line by line.", "Convert each line to lowercase.", "Check for the word error.", "Print matching lines.", "Handle a missing file error."], "code": "try:\n    file = open(\"log.txt\", \"r\")\n\n    for line in file:\n        if \"error\" in line.lower():\n            print(line.strip())\n\n    file.close()\n\nexcept FileNotFoundError:\n    print(\"Log file not found\")", "output": "2026-10-05 ERROR Database connection failed\n2026-10-05 ERROR File not found", "viva": [["What is a log file?", "A file that stores system or application events."], ["Why use lower()?", "To find Error, ERROR and error equally."], ["Which function opens a file?", "open()."], ["What happens if the file is missing?", "FileNotFoundError is handled."]]}];const completed=new Set();
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(){document.getElementById('nav').innerHTML=programs.map(p=>`<button onclick="openP(${p.id})"><b>${p.id}</b> — ${esc(p.title)}</button>`).join('');document.getElementById('list').innerHTML=programs.map(p=>`<article class="card" id="p${p.id}"><div class="head"><div class="num">${p.id}</div><div class="headmain" onclick="toggle(${p.id})"><div class="title">${esc(p.title)}</div><div class="desc">${esc(p.desc)}</div></div><button class="arrow" onclick="toggle(${p.id})">›</button></div><div class="body"><div class="tabs"><button class="tab active" onclick="showTab(event,${p.id},'aim')">AIM</button><button class="tab" onclick="showTab(event,${p.id},'steps')">STEPS</button><button class="tab" onclick="showTab(event,${p.id},'code')">CODE</button><button class="tab" onclick="showTab(event,${p.id},'output')">OUTPUT</button><button class="tab" onclick="showTab(event,${p.id},'viva')">VIVA</button></div><div class="pane active" id="aim${p.id}"><div class="label">AIM</div><div class="box">${esc(p.aim)}</div></div><div class="pane" id="steps${p.id}"><div class="label">ALGORITHM / STEPS</div><div class="steps">${p.steps.map((s,i)=>`<div class="step"><span class="sn">${i+1}</span><span>${esc(s)}</span></div>`).join('')}</div></div><div class="pane" id="code${p.id}"><div class="label">PYTHON CODE</div><div class="code"><div class="codebar"><span>program_${p.id}.py</span><button onclick="copy(${p.id})">COPY CODE</button></div><pre id="codeText${p.id}">${esc(p.code)}</pre></div></div><div class="pane" id="output${p.id}"><div class="label">SAMPLE OUTPUT</div><div class="box">${esc(p.output)}</div></div><div class="pane" id="viva${p.id}"><div class="label">VIVA QUESTIONS</div><div class="viva">${p.viva.map(v=>`<div class="v"><div class="q">Q. ${esc(v[0])}</div><div class="a">Ans: ${esc(v[1])}</div></div>`).join('')}</div></div><div class="actions"><button onclick="downloadCode(${p.id})">↓ Code</button><button onclick="downloadSteps(${p.id})">↓ Steps</button><button onclick="done(${p.id})">✓ Mark Done</button></div></div></article>`).join('')}
function toggle(id){document.getElementById('p'+id).classList.toggle('open')}function openP(id){closeMenu();let e=document.getElementById('p'+id);e.classList.add('open');setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'start'}),30)}function expand(){document.querySelectorAll('.card').forEach(e=>e.classList.add('open'))}function collapse(){document.querySelectorAll('.card').forEach(e=>e.classList.remove('open'))}
function showTab(ev,id,name){ev.stopPropagation();let b=document.getElementById('p'+id);b.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));ev.currentTarget.classList.add('active');b.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));document.getElementById(name+id).classList.add('active')}
function search(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{let ok=c.innerText.toLowerCase().includes(q);c.style.display=ok?'block':'none';if(q&&ok)c.classList.add('open')})}
function copy(id){let p=programs.find(x=>x.id===id);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(p.code).then(()=>toast('Code copied'))}else{let t=document.createElement('textarea');t.value=p.code;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Code copied')}}
function file(name,text,type){let blob=new Blob([text],{type:type||'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function downloadCode(id){let p=programs.find(x=>x.id===id);file('program_'+id+'.py',p.code,'text/x-python');toast('Code downloaded')}
function downloadSteps(id){let p=programs.find(x=>x.id===id),t='PROGRAM '+p.id+' - '+p.title+'\n\nAIM\n'+p.aim+'\n\nSTEPS\n';p.steps.forEach((s,i)=>t+=(i+1)+'. '+s+'\n');file('program_'+id+'_steps.txt',t);toast('Steps downloaded')}
function allCode(){let t='# PYTHON PRACTICAL LAB - ALL CODE\n\n';programs.forEach(p=>t+='\n# PROGRAM '+p.id+' - '+p.title+'\n\n'+p.code.trim()+'\n');file('python_practical_all_code.py',t,'text/x-python');toast('All code downloaded')}
function allSteps(){let t='PYTHON PRACTICAL LAB - ALL STEPS\n\n';programs.forEach(p=>{t+='PROGRAM '+p.id+' - '+p.title+'\n\nAIM\n'+p.aim+'\n\nSTEPS\n';p.steps.forEach((s,i)=>t+=(i+1)+'. '+s+'\n');t+='\n-------------------------\n\n'});file('python_practical_all_steps.txt',t);toast('All steps downloaded')}
function done(id){completed.add(id);document.getElementById('pt').textContent='Completed: '+completed.size+' / '+programs.length;document.getElementById('fill').style.width=(completed.size/programs.length*100)+'%';toast('Program marked done')}
function toast(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1500)}function menu(){document.getElementById('side').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}function closeMenu(){document.getElementById('side').classList.remove('open');document.getElementById('overlay').classList.remove('show')}render();</script></body></html>
