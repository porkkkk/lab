<style>
:root{

*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font-family:Arial,sans-serif;line-height:1.6
}
header{
 padding:28px 16px;
 background:linear-gradient(135deg,#172b50,#38235b,#0c1424);

}
.container{max-width:1050px;margin:auto}
h1{font-size:clamp(27px,5vw,42px);margin:12px 0}
.muted{color:var(--muted)}
nav{
 position:sticky;top:0;z-index:5;background:#080d18f2;
 border-bottom:1px solid var(--border);padding:10px
}
.navinner{
 max-width:1050px;margin:auto;display:flex;gap:8px;flex-wrap:wrap
}
button,input{font:inherit}
button{cursor:pointer}
.btn{
 padding:9px 13px;border-radius:9px;color:var(--text);
 background:var(--inner);border:1px solid var(--border)
}
.btn.primary{background:var(--accent);color:white}
main{max-width:1050px;margin:auto;padding:18px 14px 45px}
.search{
 width:100%;padding:14px;background:var(--card);color:white;
 border:1px solid var(--border);border-radius:11px;outline:none
}
.setnav{
 display:flex;gap:7px;flex-wrap:wrap;margin:17px 0
}
.setnav button.active{background:var(--accent);border-color:var(--accent)}
.setcard{
 background:var(--card);border:1px solid var(--border);
 border-radius:15px;margin:18px 0;overflow:hidden
}
.sethead{padding:17px 18px;background:#ffffff04}
.badge{
 color:var(--green);font-size:12px;font-weight:bold;
 letter-spacing:1px
}
.sethead h2{margin:5px 0;font-size:23px}
.program{padding:18px;border-top:1px solid var(--border)}
.program h3{margin:0 0 9px;font-size:18px}
.explain{
 background:#162a32;border-left:3px solid var(--green);
 padding:12px;border-radius:7px;margin:12px 0
}
.memory{background:#292440;padding:12px;border-radius:8px;margin:12px 0}
.codehead{
 display:flex;justify-content:space-between;align-items:center;
 gap:8px;flex-wrap:wrap
}
pre{
 white-space:pre;overflow-x:auto;background:#070b13;
 border:1px solid #293651;border-radius:9px;padding:14px;
 color:#b9d7ff;font-size:13px;line-height:1.65
}
.output{
 white-space:pre-wrap;overflow-wrap:anywhere;background:#0c211c;
 border:1px solid #23513f;border-radius:9px;padding:12px;
 color:#a5f3cf;font-family:monospace;font-size:13px
}
.small{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hidden{display:none!important}
footer{

 padding:25px;border-top:1px solid var(--border)

@media(max-width:500px){

 pre{font-size:12px;padding:11px}
}
@media print{
 nav,.search,.setnav,.actions,footer{display:none!important}
 body{background:white;color:black}
 .setcard{break-inside:avoid;border:1px solid #aaa;background:white}
 .program{break-inside:avoid}
 pre,.output,.explain,.memory{color:black;background:#f5f5f5}
 .setcard,.program{border-color:#aaa}
}

let selectedSet = 0;

function escapeHTML(text) {
 return String(text).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function selectSet(n) {
 selectedSet = n;
 document.querySelectorAll("#setnav button").forEach((b,i)=>{
  b.classList.toggle("active",i===n);
 });
 render();
}

function renderNav() {
 const nav = document.getElementById("setnav");
 nav.innerHTML = `<button class="btn active" onclick="selectSet(0)">All Sets</button>` +
 sets.map((s,i)=>
 `<button class="btn" onclick="selectSet(${i+1})">${s.title}</button>`
 ).join("");
}

function render() {
 const term = document.getElementById("search").value.toLowerCase();
 const container = document.getElementById("content");
 const list = sets.map((set,si)=>({...set,index:si}))
 .filter(set=>selectedSet===0 || set.index===selectedSet-1);

 let html = "";
 list.forEach(set=>{
  const matches = set.programs.map((p,pi)=>({...p,pi}))
   .filter(p=>(set.title+" "+p.title+" "+p.aim+" "+p.explain+" "+p.malayalam+" "+p.code).toLowerCase().includes(term));

  if(!matches.length) return;

  html += `<section class="setcard">
   <div class="sethead">
    <span class="badge">PRACTICAL ${set.index+1} / 10</span>
    <h2>${set.title}</h2>
    <p class="muted">${matches.length} program${matches.length>1?"s":""}</p>
   </div>`;

  matches.forEach((p)=>{
   const id = "code-"+set.index+"-"+p.pi;
   html += `<article class="program">
    <span class="badge">PROGRAM ${p.pi+1}</span>
    <h3>${p.title}</h3>
    <p><strong>Aim:</strong> ${p.aim}</p>
    <div class="explain">
     <strong>Simple Explanation</strong><br>${p.explain}
    </div>
    <div class="memory">
     <strong>Malayalam Hint / Memory Trick</strong><br>${p.malayalam}
     <br><br><strong>Remember:</strong> ${p.memory}
    </div>
    <div class="codehead">
     <strong>Python Code</strong>
     <button class="btn" onclick="copyCode('${id}',this)">Copy Code</button>
    </div>
    <pre id="${id}">${escapeHTML(p.code)}</pre>
    <strong>Sample Output</strong>
    <div class="output">${escapeHTML(p.output)}</div>
    <div class="actions">
     <button class="btn" onclick="toggleCode('${id}',this)">Hide Code</button>
     <button class="btn" onclick="copyCode('${id}',this)">Copy for Revision</button>
    </div>
   </article>`;
  });
  html += `</section>`;
 });

 container.innerHTML = html || "<p>No matching programs. Try another search.</p>";
}

async function copyCode(id,button) {
 const code = document.getElementById(id).textContent;
 try {
  if(navigator.clipboard && window.isSecureContext) {
   await navigator.clipboard.writeText(code);
  } else {
   throw new Error("Clipboard unavailable");
  }
  const old = button.textContent;
  button.textContent = "Copied!";
  setTimeout(()=>button.textContent=old,1200);
 } catch(e) {
  const area=document.createElement("textarea");
  area.value=code;
  document.body.appendChild(area);
  area.select();
  try {
   document.execCommand("copy");
   alert("Code copied!");
  } catch(err) {
   alert("Please select and copy the code manually.");
  }
  area.remove();
 }
}

function toggleCode(id,button) {
 const pre=document.getElementById(id);
 pre.classList.toggle("hidden");
 button.textContent=pre.classList.contains("hidden")?"Show Code":"Hide Code";
}

function scrollToTop() {
 window.scrollTo({top:0,behavior:"smooth"});
}

renderNav();
render();
</script>
